name: Docker build (backend)

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/docker-build-backend.yml"

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build image
        timeout-minutes: 15
        run: docker build --progress=plain -t fluentcheck-backend:smoke .
      - name: Run container smoke test
        timeout-minutes: 10
        env:
          SMOKE_IMAGE_PREBUILT: "1"
        run: npm run test:docker
