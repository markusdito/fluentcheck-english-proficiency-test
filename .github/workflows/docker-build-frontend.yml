name: Docker build (frontend)

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/docker-build-frontend.yml"

jobs:
  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build image
        timeout-minutes: 15
        run: docker build --progress=plain -t fluentcheck-frontend:smoke .
      - name: Run container smoke test
        timeout-minutes: 5
        env:
          SMOKE_IMAGE_PREBUILT: "1"
        run: npm run test:docker
