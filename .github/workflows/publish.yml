# Publishes production images to ghcr.io, on manual dispatch only. There is no
# automatic publishing on push, merge, or tag.
#
# Each image is tagged with its own app's package.json version (read at
# dispatch time), the commit SHA (sha-<short>), and latest. The two packages
# release on independent cadences.
#
# Tag overwrite semantics: re-dispatching with an unchanged package.json
# version overwrites the version, sha, and latest tags idempotently — last
# write wins. The version tag always points at the most recent push of that
# version, and latest always reflects the most recent dispatch.
#
# Package visibility: the first publish creates each ghcr package as private,
# linked to this repository. To pull it without docker login, change the
# package to public under Packages -> fluentcheck-backend/frontend -> Package
# settings -> Danger Zone -> Change visibility. Otherwise `docker login
# ghcr.io` with a token that has read:packages.
#
# Dispatching requires this workflow file to exist on the dispatched ref; the
# Actions UI lists it once it reaches the default branch.
name: Publish images

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Publish fluentcheck-backend
        type: boolean
        default: false
      frontend:
        description: Publish fluentcheck-frontend
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  backend:
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and short SHA
        id: meta
        run: |
          echo "version=$(jq -r .version backend/package.json)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/markusdito/fluentcheck-backend:${{ steps.meta.outputs.version }}
            ghcr.io/markusdito/fluentcheck-backend:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/markusdito/fluentcheck-backend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  frontend:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and short SHA
        id: meta
        run: |
          echo "version=$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/markusdito/fluentcheck-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/markusdito/fluentcheck-frontend:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/markusdito/fluentcheck-frontend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
