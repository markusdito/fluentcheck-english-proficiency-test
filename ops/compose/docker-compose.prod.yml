# Production deployment topology for the VPS. Backend and frontend containers
# only; PostgreSQL is external/managed and reached through DATABASE_URL in
# backend.env.
#
# Image versions are pinned through the BACKEND_IMAGE / FRONTEND_IMAGE
# variables in .env — deploy.sh rewrites them to immutable sha-<short> tags
# before every `up`, so what runs is never the moving `latest` pointer.
# The defaults below only exist for first-time manual bring-up.
#
# Ports bind to 127.0.0.1 only: the reverse proxy on the host terminates TLS
# and forwards to 127.0.0.1:3000 (frontend) and 127.0.0.1:5001 (backend).
# Containers are never exposed directly.
#
# Client IPs and rate limits: the frontend's /backend-api rewrite goes straight
# to http://backend:5001 on this project's network, so the backend sees exactly
# one proxy hop in front of it. Requests that host nginx sends to the published
# 127.0.0.1:5001 arrive from the network gateway. Both addresses sit in the
# pinned subnet below, which is the backend's only trusted proxy range. Keep
# the subnet and RATE_LIMIT_TRUST_PROXY identical, or every user shares one
# req.ip and one rate-limit bucket. Host nginx must append the client with
# `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`, and anything
# on the host that can reach 127.0.0.1:5001 is trusted to set that header.
# The compose value overrides RATE_LIMIT_TRUST_PROXY in backend.env.

name: fluentcheck

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/markusdito/fluentcheck-backend:latest}
    pull_policy: always
    env_file: backend.env
    environment:
      RATE_LIMIT_TRUST_PROXY: 172.31.250.0/24
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/markusdito/fluentcheck-frontend:latest}
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:5001
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
